<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Sofiah Kabir</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --teal-500: #14b8a6;
        --blue-600: #2563eb;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        font-family: "DM Sans", system-ui, sans-serif;
        background: radial-gradient(circle at top, rgba(20, 184, 166, 0.09), transparent 45%), var(--bg);
        color: var(--text);
      }

      .card {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2rem 1.4rem;
        text-align: center;
        box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 0.55rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      p {
        margin: 0 0 1.2rem;
        color: var(--muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.65rem 1.2rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, var(--teal-500), var(--blue-600));
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Thank you, your message was sent!</h1>
      <p>I appreciate you reaching out. I will get back to you soon.</p>
      <a class="btn" href="index.html">Back to Portfolio</a>
    </main>
  </body>
</html>
